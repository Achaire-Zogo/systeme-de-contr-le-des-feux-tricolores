<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système de Contrôle des Feux Tricolores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
        }
        .feu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            background-color: white;
        }
        .feu {
            width: 100px;
            height: 250px;
            background-color: #333;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 10px;
        }
        .lumiere {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto;
            opacity: 0.3;
        }
        .rouge { background-color: red; }
        .orange { background-color: orange; }
        .vert { background-color: green; }
        
        .active { opacity: 1; box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.5); }
        
        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        .btn-group {
            margin-bottom: 10px;
        }
        
        .settings {
            margin-top: 30px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Système de Contrôle des Feux Tricolores</h1>
            <p>Simulation et contrôle de feux de circulation</p>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        Visualisation des Carrefours
                    </div>
                    <div class="card-body">
                        <div id="carrefours-container" class="row">
                            <!-- Les carrefours seront générés dynamiquement ici -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        Contrôles du Système
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button id="btn-demarrer" class="btn btn-success">Démarrer le système</button>
                            <button id="btn-arreter" class="btn btn-danger" disabled>Arrêter le système</button>
                        </div>
                        
                        <div class="mt-4">
                            <h5>Mode de fonctionnement</h5>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="mode" id="mode-auto" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="mode-auto">Automatique</label>
                                
                                <input type="radio" class="btn-check" name="mode" id="mode-manuel" autocomplete="off">
                                <label class="btn btn-outline-primary" for="mode-manuel">Manuel</label>
                            </div>
                        </div>
                        
                        <div class="settings">
                            <h5>Paramètres de durée (secondes)</h5>
                            <form id="form-duree">
                                <div class="form-group">
                                    <label for="duree-vert">Durée du feu vert:</label>
                                    <input type="number" class="form-control" id="duree-vert" value="30" min="5" max="60">
                                </div>
                                <div class="form-group">
                                    <label for="duree-orange">Durée du feu orange:</label>
                                    <input type="number" class="form-control" id="duree-orange" value="5" min="1" max="10">
                                </div>
                                <div class="form-group">
                                    <label for="duree-rouge">Durée du feu rouge:</label>
                                    <input type="number" class="form-control" id="duree-rouge" value="35" min="5" max="60">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Appliquer</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let systemData = null;
        let websocket = null;
        let systemRunning = false;
        
        // Initialisation de la page
        document.addEventListener('DOMContentLoaded', () => {
            // Charger les données initiales du système
            fetchSystemData();
            
            // Configurer les événements des boutons
            document.getElementById('btn-demarrer').addEventListener('click', demarrerSysteme);
            document.getElementById('btn-arreter').addEventListener('click', arreterSysteme);
            document.getElementById('mode-auto').addEventListener('change', changerMode);
            document.getElementById('mode-manuel').addEventListener('change', changerMode);
            document.getElementById('form-duree').addEventListener('submit', changerDuree);
            
            // Initialiser la connexion WebSocket
            connectWebSocket();
        });
        
        // Fonction pour récupérer les données du système
        async function fetchSystemData() {
            try {
                const response = await fetch('/api/systeme');
                systemData = await response.json();
                updateUI();
            } catch (error) {
                console.error('Erreur lors de la récupération des données:', error);
            }
        }
        
        // Fonction pour mettre à jour l'interface utilisateur
        function updateUI() {
            if (!systemData) return;
            
            const carrefoursContainer = document.getElementById('carrefours-container');
            carrefoursContainer.innerHTML = '';
            
            systemData.carrefours.forEach(carrefour => {
                const carrefourElement = document.createElement('div');
                carrefourElement.className = 'col-md-6 mb-4';
                carrefourElement.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            ${carrefour.nom}
                        </div>
                        <div class="card-body">
                            <div class="d-flex flex-wrap justify-content-around">
                                ${carrefour.feux.map(feu => createFeuHTML(feu)).join('')}
                            </div>
                        </div>
                    </div>
                `;
                carrefoursContainer.appendChild(carrefourElement);
            });
            
            // Mettre à jour l'état des boutons
            document.getElementById('btn-demarrer').disabled = systemData.en_marche;
            document.getElementById('btn-arreter').disabled = !systemData.en_marche;
            document.getElementById('mode-auto').checked = systemData.mode_automatique;
            document.getElementById('mode-manuel').checked = !systemData.mode_automatique;
            
            // Mettre à jour les valeurs des durées
            document.getElementById('duree-vert').value = systemData.duree_vert;
            document.getElementById('duree-orange').value = systemData.duree_orange;
            document.getElementById('duree-rouge').value = systemData.duree_rouge;
            
            // Ajouter les événements pour le mode manuel
            if (!systemData.mode_automatique) {
                document.querySelectorAll('.btn-feu').forEach(btn => {
                    btn.addEventListener('click', changerEtatFeu);
                });
            }
        }
        
        // Fonction pour créer l'HTML d'un feu
        function createFeuHTML(feu) {
            return `
                <div class="feu-container">
                    <h5>${feu.nom}</h5>
                    <div class="feu" data-feu-id="${feu.id}">
                        <div class="lumiere rouge ${feu.etat === 'rouge' ? 'active' : ''}"></div>
                        <div class="lumiere orange ${feu.etat === 'orange' ? 'active' : ''}"></div>
                        <div class="lumiere vert ${feu.etat === 'vert' ? 'active' : ''}"></div>
                    </div>
                    <div class="timer">${feu.temps_restant}s</div>
                    ${!systemData.mode_automatique ? `
                        <div class="btn-group mt-2" role="group">
                            <button class="btn btn-sm btn-danger btn-feu" data-feu-id="${feu.id}" data-etat="rouge">R</button>
                            <button class="btn btn-sm btn-warning btn-feu" data-feu-id="${feu.id}" data-etat="orange">O</button>
                            <button class="btn btn-sm btn-success btn-feu" data-feu-id="${feu.id}" data-etat="vert">V</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        // Fonction pour démarrer le système
        async function demarrerSysteme() {
            try {
                const response = await fetch('/api/demarrer', {
                    method: 'POST',
                });
                const result = await response.json();
                console.log(result.message);
                fetchSystemData();
            } catch (error) {
                console.error('Erreur lors du démarrage du système:', error);
            }
        }
        
        // Fonction pour arrêter le système
        async function arreterSysteme() {
            try {
                const response = await fetch('/api/arreter', {
                    method: 'POST',
                });
                const result = await response.json();
                console.log(result.message);
                fetchSystemData();
            } catch (error) {
                console.error('Erreur lors de l\'arrêt du système:', error);
            }
        }
        
        // Fonction pour changer le mode de fonctionnement
        async function changerMode(event) {
            const mode = event.target.id === 'mode-auto' ? 'auto' : 'manuel';
            try {
                const formData = new FormData();
                formData.append('mode', mode);
                
                const response = await fetch('/api/mode', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                console.log(result.message);
                fetchSystemData();
            } catch (error) {
                console.error('Erreur lors du changement de mode:', error);
            }
        }
        
        // Fonction pour changer la durée des feux
        async function changerDuree(event) {
            event.preventDefault();
            
            const vert = document.getElementById('duree-vert').value;
            const orange = document.getElementById('duree-orange').value;
            const rouge = document.getElementById('duree-rouge').value;
            
            try {
                const formData = new FormData();
                formData.append('vert', vert);
                formData.append('orange', orange);
                formData.append('rouge', rouge);
                
                const response = await fetch('/api/duree', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                console.log(result.message);
                fetchSystemData();
            } catch (error) {
                console.error('Erreur lors du changement des durées:', error);
            }
        }
        
        // Fonction pour changer l'état d'un feu en mode manuel
        async function changerEtatFeu(event) {
            const feuId = event.target.dataset.feuId;
            const etat = event.target.dataset.etat;
            
            try {
                const formData = new FormData();
                formData.append('etat', etat);
                
                const response = await fetch(`/api/feu/${feuId}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                console.log(result.message);
                if (result.status === 'success') {
                    fetchSystemData();
                }
            } catch (error) {
                console.error('Erreur lors du changement d\'état du feu:', error);
            }
        }
        
        // Fonction pour établir une connexion WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = () => {
                console.log('Connexion WebSocket établie');
            };
            
            websocket.onmessage = (event) => {
                systemData = JSON.parse(event.data);
                updateUI();
            };
            
            websocket.onclose = () => {
                console.log('Connexion WebSocket fermée');
                // Tentative de reconnexion après 2 secondes
                setTimeout(connectWebSocket, 2000);
            };
            
            websocket.onerror = (error) => {
                console.error('Erreur WebSocket:', error);
            };
        }
    </script>
</body>
</html>
